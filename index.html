<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <title>SMart – Student Marketplace | KPTM Alor Setar</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
/* =========================================================
   SMart – styles (mobile first)
   ========================================================= */
:root {
  --brand: #C8102E;
  --brand-dark: #9E0B22;
  --brand-soft: #FDECEE;
  --accent: #E0A526;
  --accent-soft: #FCEFD0;
  --text: #1B2733;
  --muted: #66727F;
  --line: #E4E9EF;
  --surface: #FFFFFF;
  --soft: #F5F7FA;
  --page: #F0F2F5;
  --grey: #5B6672;
  --grey-soft: #ECEFF2;
  --green: #1E7A3C;
  --green-soft: #DDF3E4;
  --red: #B3261E;
  --red-soft: #FBE1E1;
  --orange: #9A6A00;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
  --top: 70px;
  --bottom: 62px;
  --side: 232px;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  font-family: 'Poppins', 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-size: 15px;
  line-height: 1.5;
  color: var(--text);
  background: var(--page);
}

body.modal-open { overflow: hidden; }

h1, h2, h3, p { margin: 0; }
h1 { font-size: 1.35rem; line-height: 1.25; }
h2 { font-size: 1.05rem; }
h3 { font-size: 1.1rem; margin-bottom: 8px; }
a { color: var(--brand); text-decoration: none; }
a:hover { text-decoration: underline; }
img { max-width: 100%; display: block; }
ul, ol { margin: 0; padding: 0; list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }

.muted { color: var(--muted); }
.small { font-size: 0.8rem; }
.center { text-align: center; }

/* ---------- Top bar ---------- */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 30;
  height: var(--top);
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 0 14px;
  background: #fff;
  color: var(--text);
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
}

.logo { font-weight: 700; font-size: 1.7rem; color: var(--brand); letter-spacing: -0.5px; }
.logo { display: inline-flex; align-items: center; }
.logo:hover { text-decoration: none; }
.kptm-chip { height: 44px; width: auto; margin-right: 12px; padding-right: 12px; border-right: 1px solid var(--line); }
.kptm-logo { width: 150px; height: auto; margin: 0 auto 10px; }
.auth-brand .logo { justify-content: center; }
.logo span { color: var(--text); }
.logo-big { font-size: 2.4rem; color: var(--brand); }

.mode-toggle { display: flex; background: var(--page); border-radius: 999px; padding: 4px; }
.mode-word { display: none; }
@media (min-width: 480px) { .mode-word { display: inline; } }
.mode-toggle button {
  border: 0; background: transparent; color: var(--muted); cursor: pointer;
  padding: 8px 15px; border-radius: 999px; font-size: 0.88rem; font-weight: 500; white-space: nowrap;
}
.mode-toggle button.active { background: var(--brand); color: #fff; font-weight: 600; }

/* ---------- Layout ---------- */
.view {
  padding: calc(var(--top) + 16px) 16px calc(var(--bottom) + 24px);
  max-width: 1080px;
  margin: 0 auto;
}

.sidebar { display: none; }

.bottomnav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
  height: var(--bottom);
  display: flex;
  background: #fff;
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}

.nav-link {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  color: var(--muted); font-size: 0.68rem; font-weight: 500;
}
.nav-link:hover { text-decoration: none; }
.nav-link.active { color: var(--brand); font-weight: 600; }
.nav-icon { position: relative; display: inline-flex; font-size: 1.35rem; line-height: 1; margin-bottom: 2px; }
.ico { width: 1.15em; height: 1.15em; flex: none; display: inline-block; vertical-align: -0.2em; }

.nav-badge {
  position: absolute; top: -4px; right: -12px;
  min-width: 17px; height: 17px; padding: 0 4px;
  border-radius: 999px; background: var(--red); color: #fff;
  font-size: 0.65rem; font-weight: 600; line-height: 17px; text-align: center; font-style: normal;
}
.nav-badge.static { position: static; flex: none; }

body.auth .topbar, body.auth .sidebar, body.auth .bottomnav { display: none; }
body.auth { background: #fff; }
body.auth .view { padding: 24px 16px; }

/* ---------- Cards, buttons, forms ---------- */
.card {
  background: var(--surface);
  border: 1px solid transparent;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 9px 18px;
  border: 1.5px solid transparent; border-radius: 10px;
  font-weight: 600; font-size: 0.92rem; cursor: pointer; text-align: center;
  transition: background 0.15s, transform 0.05s;
}
.btn:hover { text-decoration: none; }
.btn:active { transform: scale(0.98); }
.btn:disabled { background: var(--grey-soft); color: var(--muted); cursor: not-allowed; }
.btn-block { width: 100%; }
.btn-sm { min-height: 34px; padding: 5px 12px; font-size: 0.82rem; }
.btn-primary { background: var(--brand); color: #fff; }
.btn-primary:hover { background: var(--brand-dark); }
.btn-accent { background: var(--accent); color: #2A1E00; }
.btn-success { background: var(--green); color: #fff; }
.btn-danger { background: var(--red); color: #fff; }
.btn-outline { background: #fff; border-color: var(--brand); color: var(--brand); }
.btn-outline:hover { background: var(--brand-soft); }
.btn-danger-outline { background: #fff; border-color: var(--red); color: var(--red); }
.btn-danger-outline:hover { background: var(--red-soft); }
.btn-ghost { background: var(--soft); color: var(--text); }

.field { display: block; margin-bottom: 14px; }
.field > span { display: block; font-size: 0.82rem; font-weight: 500; margin-bottom: 5px; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

input[type="text"], input[type="email"], input[type="password"], input[type="tel"], input[type="url"],
input[type="number"], input[type="time"], input[type="search"], input[type="file"], select, textarea {
  width: 100%; min-height: 44px; padding: 9px 12px;
  border: 1.5px solid var(--line); border-radius: 10px;
  background: #fff; font-size: 16px; /* 16px stops iOS from zooming in */
}
textarea { resize: vertical; }
input[type="file"] { padding: 8px; font-size: 0.85rem; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(200, 16, 46, 0.14); }
button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.hint { font-size: 0.78rem; color: var(--muted); margin: 10px 0; text-align: center; }
.notice { background: var(--brand-soft); border-radius: 10px; padding: 12px; font-size: 0.88rem; margin-top: 14px; }

.badge {
  display: inline-flex; align-items: center; flex: none;
  padding: 3px 10px; border-radius: 999px;
  font-size: 0.74rem; font-weight: 600; white-space: nowrap;
}
.tag {
  display: inline-block; padding: 2px 9px; border-radius: 999px;
  background: var(--brand-soft); color: var(--brand); font-size: 0.72rem; font-weight: 600;
}

/* Status colours */
.st-Pending   { background: var(--grey-soft);   color: var(--grey); }
.st-Accepted  { background: #DCE9F6;            color: #1F4E79; }
.st-Ready     { background: var(--accent-soft); color: var(--orange); }
.st-Completed { background: var(--green-soft);  color: var(--green); }
.st-Cancelled { background: var(--red-soft);    color: var(--red); }
.bg-Pending   { background: #9AA5B1; }
.bg-Accepted  { background: #1F4E79; }
.bg-Ready     { background: var(--accent); }
.bg-Completed { background: #2E9E55; }
.bg-Cancelled { background: #D2473F; }

/* ---------- Page headings ---------- */
.page-title { margin-bottom: 2px; }
.page-sub { margin-bottom: 16px; font-size: 0.88rem; }
.sub-title { margin: 24px 0 12px; }
.page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
.back { display: inline-block; margin-bottom: 12px; font-weight: 500; font-size: 0.9rem; }
.section { margin-top: 18px; }
.section > h2 { margin-bottom: 10px; }
.stack { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; } /* minmax(0, ...) stops wide images from stretching the cards */
.grid { display: grid; gap: 12px; }

.empty { text-align: center; padding: 36px 16px; color: var(--muted); }
.empty-icon { font-size: 2.4rem; line-height: 1; margin-bottom: 6px; }
.empty strong { display: block; color: var(--text); margin-top: 4px; }

/* ---------- Auth pages ---------- */
.auth-wrap { max-width: 420px; margin: 0 auto; }
.auth-brand { text-align: center; margin: 12px 0 20px; }
.auth-brand p { color: var(--muted); font-size: 0.88rem; }
.auth-card { padding: 22px 20px; }
.auth-card h1 { margin-bottom: 4px; }
.auth-card > .muted { margin-bottom: 18px; font-size: 0.88rem; }
.auth-card p.center { margin-top: 14px; font-size: 0.88rem; }
.pending-icon { font-size: 3rem; line-height: 1; color: var(--accent); }
.pending-msg { margin: 10px 0; padding: 12px; border-radius: 10px; background: var(--accent-soft); color: var(--orange); font-weight: 600; }

/* ---------- Home ---------- */
.banner {
  margin: -16px -16px 12px; padding: 18px 16px 20px;
  background: linear-gradient(135deg, var(--brand), #E8364F); color: #fff;
}
.banner p { font-size: 0.9rem; opacity: 0.92; margin-bottom: 12px; }

.cats { display: flex; gap: 4px; overflow-x: auto; padding: 12px 8px; scrollbar-width: none; }
.cats::-webkit-scrollbar { display: none; }
.cat {
  flex: 1 0 72px; display: flex; flex-direction: column; align-items: center; gap: 6px;
  border: 0; background: none; cursor: pointer; padding: 4px 2px;
  font-size: 0.74rem; font-weight: 500; color: var(--text);
}
.cat-icon {
  width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center;
  background: var(--brand-soft); color: var(--brand); font-size: 1.3rem;
}
.cat.active { color: var(--brand); font-weight: 600; }
.cat.active .cat-icon { background: var(--brand); color: #fff; }

.search {
  display: flex; align-items: center; gap: 8px;
  padding: 0 14px; border: 1.5px solid transparent; border-radius: 999px; background: #fff; color: var(--muted);
}
.search:focus-within { border-color: var(--brand); background: #fff; }
.search input { border: 0; background: transparent; padding-left: 0; box-shadow: none !important; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px; margin: 0 -16px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; padding: 7px 14px; min-height: 36px;
  border: 1.5px solid var(--line); border-radius: 999px; background: #fff;
  font-size: 0.82rem; font-weight: 500; cursor: pointer; white-space: nowrap;
}
.chip b { font-weight: 600; opacity: 0.7; margin-left: 2px; }
.chip.active { background: var(--brand); border-color: var(--brand); color: #fff; }

.h-scroll {
  display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory;
  padding: 2px 16px 12px; margin: 0 -16px;
}
.h-scroll > * { flex: 0 0 82%; max-width: 320px; scroll-snap-align: center; }

.post { padding: 12px 14px; overflow: hidden; }
.post-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.post-head .avatar-img { width: 44px; height: 44px; }
.post-head strong { color: var(--text); font-size: 0.95rem; }
.post-head > div { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.3; }
.post-text { font-size: 0.95rem; line-height: 1.45; overflow-wrap: anywhere; }
.post-img { display: block; margin: 10px -14px 0; width: calc(100% + 28px); max-width: none; height: auto; max-height: 460px; aspect-ratio: 16 / 9; object-fit: cover; background: var(--page); }
.post-stats { display: flex; justify-content: space-between; padding: 10px 0 8px; font-size: 0.8rem; color: var(--muted); }
.post-actions { display: flex; gap: 4px; border-top: 1px solid var(--line); padding-top: 4px; margin-bottom: -6px; }
.post-actions button {
  flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 40px; border: 0; background: none; border-radius: 8px; cursor: pointer;
  font-weight: 600; font-size: 0.85rem; color: var(--muted);
}
.post-actions button:hover { background: var(--page); }
.post-actions .liked { color: var(--brand); }
.post-actions .liked .ico { fill: currentColor; }
.comments { display: grid; gap: 8px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
.comment { justify-self: start; background: var(--page); border-radius: 14px; padding: 7px 12px; font-size: 0.86rem; overflow-wrap: anywhere; }
.comment strong { display: block; font-size: 0.8rem; }
.comment-form { display: flex; gap: 8px; }
.comment-form input { min-height: 40px; border-radius: 999px; background: var(--page); border-color: transparent; }
.comment-form .btn { border-radius: 999px; }

/* Home feed layout: create-post box, shops as story bubbles, product strip, then posts */
.home-layout { display: grid; margin-top: 12px; }
.home-layout > * { min-width: 0; }
.composer { padding: 12px; }
.composer-top { display: flex; gap: 10px; align-items: flex-start; }
.composer textarea { border-color: transparent; background: var(--page); border-radius: 18px; resize: none; }
.composer-bottom { display: flex; gap: 8px; align-items: center; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.composer-bottom input { flex: 1; min-width: 0; }
.composer-note { margin-top: 8px; }
.feed-title { margin: 18px 0 10px; }

.stories { display: flex; gap: 12px; overflow-x: auto; padding: 4px 16px 8px; margin: 0 -16px; scrollbar-width: none; }
.stories::-webkit-scrollbar { display: none; }
.story {
  flex: 0 0 78px; display: flex; flex-direction: column; align-items: center; gap: 3px;
  text-align: center; color: var(--text); font-size: 0.72rem; font-weight: 600; line-height: 1.25;
}
.story:hover { text-decoration: none; }
.story img { width: 64px; height: 64px; margin-bottom: 4px; border-radius: 50%; object-fit: cover; border: 3px solid #fff; box-shadow: 0 0 0 2px var(--brand); }
.story .muted { font-weight: 400; font-size: 0.68rem; }

.feed-products { padding: 14px 14px 6px; }
.feed-products h2 { margin-bottom: 10px; }
.feed-products .product-card { box-shadow: none; border-color: var(--line); }
.product-strip { display: flex; gap: 8px; overflow-x: auto; padding: 2px 14px 10px; margin: 0 -14px; }
.product-strip > * { flex: 0 0 150px; }

.avatar-img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex: none; border: 1px solid var(--line); }
.avatar {
  width: 40px; height: 40px; border-radius: 50%; flex: none;
  display: grid; place-items: center; background: var(--brand); color: #fff; font-weight: 700;
}
.avatar.big { width: 64px; height: 64px; font-size: 1.6rem; }

.shops-grid { grid-template-columns: 1fr; }
.shop-card { display: flex; align-items: center; gap: 12px; padding: 12px; color: var(--text); }
.shop-card:hover { text-decoration: none; border-color: var(--brand); }
.shop-card > div { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; min-width: 0; }
.shop-logo { width: 56px; height: 56px; border-radius: 14px; object-fit: cover; flex: none; border: 1px solid var(--line); }
.shop-logo.big { width: 84px; height: 84px; border-radius: 20px; }

.products-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
.product-card { display: flex; flex-direction: column; overflow: hidden; color: var(--text); }
.product-card { transition: transform 0.12s, box-shadow 0.12s; }
.product-card:hover { text-decoration: none; border-color: var(--brand); transform: translateY(-2px); box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12); }
.product-photo { position: relative; }
.product-photo img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; }
.product-photo.big img { border-radius: var(--radius); border: 1px solid var(--line); }
.sold-out .product-photo img { filter: grayscale(0.8); opacity: 0.65; }
.soldout-badge {
  position: absolute; top: 8px; left: 8px;
  background: var(--red); color: #fff; padding: 3px 10px; border-radius: 999px; font-size: 0.72rem; font-weight: 600;
}
.product-body { display: flex; flex-direction: column; gap: 1px; padding: 8px 10px 10px; }
.product-name {
  font-size: 0.86rem; line-height: 1.35; min-height: 2.7em; overflow-wrap: anywhere;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.price-row { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; margin: 2px 0; }
.price-row .price { font-size: 1.05rem; }
.stock-out { color: var(--red); font-weight: 600; }
.price { color: var(--brand); font-weight: 700; }
.price.big { font-size: 1.6rem; }
.shop-line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- Shop page ---------- */
.shop-header { display: flex; gap: 14px; padding: 16px; }
.shop-info { flex: 1; min-width: 0; }
.shop-info p { margin: 8px 0; font-size: 0.9rem; }
.meta-list { display: flex; flex-direction: column; gap: 2px; font-size: 0.86rem; margin-bottom: 12px; }

.tabs { display: flex; border-bottom: 2px solid var(--line); margin: 18px 0 14px; }
.tab {
  flex: 1; padding: 11px; border: 0; background: none; cursor: pointer;
  font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -2px;
}
.tab.active { color: var(--brand); border-bottom-color: var(--brand); }

/* ---------- Product detail ---------- */
.product-detail { display: grid; gap: 14px; }
.product-info { padding: 16px; }
.product-info h1 { margin: 6px 0 2px; }
.product-info > p { margin: 10px 0; font-size: 0.92rem; }
.stock { font-size: 0.86rem; font-weight: 600; color: var(--green); }
.stock.out { color: var(--red); }
.shop-mini {
  display: flex; align-items: center; gap: 10px; padding: 10px;
  background: var(--soft); border-radius: 10px; color: var(--text); margin-bottom: 14px;
}
.shop-mini:hover { text-decoration: none; }
.shop-mini > div { flex: 1; display: flex; flex-direction: column; line-height: 1.3; }

.qty { display: flex; align-items: center; gap: 10px; }
.qty button {
  width: 44px; height: 44px; border: 1.5px solid var(--line); border-radius: 10px;
  background: #fff; font-size: 1.3rem; font-weight: 600; cursor: pointer; color: var(--brand);
}
.qty output { min-width: 32px; text-align: center; font-weight: 700; font-size: 1.15rem; }

.total-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 0; border-top: 1px dashed var(--line); margin-top: 6px;
}
.total-row strong { font-size: 1.15rem; color: var(--brand); }

/* ---------- Orders ---------- */
.order { padding: 14px; }
.order-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
.order-head > div { display: flex; flex-direction: column; min-width: 0; }

.tracker { display: flex; margin: 4px 0 14px; }
.tracker li { flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.tracker li::before {
  content: ''; position: absolute; top: 12px; right: 50%; width: 100%; height: 3px; background: var(--line);
}
.tracker li:first-child::before { display: none; }
.tracker li.done::before { background: var(--brand); }
.tracker .dot {
  position: relative; z-index: 1; width: 26px; height: 26px; border-radius: 50%;
  display: grid; place-items: center; background: var(--line); color: var(--muted); font-size: 0.72rem; font-weight: 700;
}
.tracker li.done .dot { background: var(--brand); color: #fff; }
.tracker li.current .dot { box-shadow: 0 0 0 4px var(--brand-soft); }
.step-label { font-size: 0.7rem; color: var(--muted); font-weight: 500; }
.tracker li.done .step-label { color: var(--text); }
.tracker-cancelled {
  margin: 4px 0 12px; padding: 8px 12px; border-radius: 10px;
  background: var(--red-soft); color: var(--red); font-weight: 600; font-size: 0.86rem;
}

.items li { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; font-size: 0.9rem; }
.items li span:last-child { white-space: nowrap; }
.order-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.85rem; color: var(--muted); }
.order-note { margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: var(--soft); font-size: 0.85rem; overflow-wrap: anywhere; }
.order-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: 0.9rem; font-weight: 500; cursor: pointer; min-height: 44px; }
.check input { width: 20px; height: 20px; accent-color: var(--green); }
.paid { color: var(--green); font-weight: 600; font-size: 0.86rem; }

/* ---------- Chat ---------- */
.chat {
  height: calc(100vh - var(--top) - var(--bottom) - 40px);
  height: calc(100dvh - var(--top) - var(--bottom) - 40px);
  display: flex; min-height: 320px;
}

    var hours = Math.floor(mins / 60);
    if (hours < 24) return hours + ' h ago';
    var days = Math.floor(hours / 24);
    if (days < 7) return days + (days === 1 ? ' day ago' : ' days ago');
    return new Date(ts).toLocaleDateString('en-MY', { day: 'numeric', month: 'short' });
  }

  function clock(ts) {
    return new Date(ts).toLocaleTimeString('en-MY', { hour: 'numeric', minute: '2-digit' });
  }

  // "13:30" -> "1:30 PM"
  function fmtPickup(hhmm) {
    if (!hhmm) return '—';
    var parts = hhmm.split(':');
    var h = Number(parts[0]);
    return (h % 12 || 12) + ':' + parts[1] + ' ' + (h < 12 ? 'AM' : 'PM');
  }

  function sameDay(ts, date) {
    var d = new Date(ts);
    return d.getFullYear() === date.getFullYear() && d.getMonth() === date.getMonth() && d.getDate() === date.getDate();
  }

  function badge(status) {
    return '<span class="badge st-' + status + '">' + status + '</span>';
  }

  function emptyState(icon, title, text) {
    return '<div class="empty"><div class="empty-icon">' + svg(icon) + '</div><strong>' + title + '</strong><p>' + text + '</p></div>';
  }

  function restock(order) {

    var parts = route();
    var page = parts[0];
    var isAuth = AUTH_PAGES.indexOf(page) !== -1;

    if (!state.loggedIn && !isAuth) { location.replace('#login'); return; }
    if (state.loggedIn && isAuth) { location.replace('#home'); return; }

    if (page === 'seller') state.mode = 'seller';
    else if (BUYER_PAGES.indexOf(page) !== -1) state.mode = 'buyer';

    var changed = state.lastHash !== location.hash;
    if (changed && page === 'product') state.qty = 1;
    if (changed && page === 'shop') state.shopTab = 'products';

    afterRender = null;
    var html;
    switch (page) {
      case 'login':    html = viewLogin(); break;
      case 'register': html = viewRegister(); break;
      case 'pending':  html = viewPending(); break;
      case 'home':     html = viewHome(); break;
      case 'shop':     html = viewShop(Number(parts[1])); break;
      case 'product':  html = viewProduct(Number(parts[1])); break;
      case 'orders':   html = viewOrders(); break;
      case 'chat':     html = viewChat(Number(parts[1])); break;
      case 'profile':  html = viewProfile(); break;
      case 'seller':
        switch (parts[1]) {

          case 'orders':   html = viewSellerOrders(); break;

  /* ======================= Smart Recommend ("AI" button in the search bar) =======================
     Runs fully in the browser: it filters the products by budget and category, then scores
     them by how well they match the words the student typed (plus how popular they are). */

  // Extra words to look for when the student types a general word
  var AI_WORDS = {
    spicy: ['pedas', 'sambal', 'tom yam', 'curry', 'chili'], pedas: ['pedas', 'sambal', 'tom yam', 'curry', 'chili'],
    cold: ['ais', 'iced', 'shake', 'cold'], sejuk: ['ais', 'iced', 'shake', 'cold'],
    sweet: ['brownies', 'kuih', 'milo', 'bandung', 'coconut'], manis: ['brownies', 'kuih', 'milo', 'bandung', 'coconut'],
    rice: ['nasi'], breakfast: ['nasi lemak', 'karipap', 'teh'], sarapan: ['nasi lemak', 'karipap', 'teh'],
    lunch: ['nasi', 'mee'], dinner: ['nasi', 'mee', 'maggi'], supper: ['maggi', 'keropok', 'popia'],
    snack: ['keropok', 'popia', 'karipap', 'brownies', 'kuih'], snacks: ['keropok', 'popia', 'karipap', 'brownies', 'kuih'],
    coffee: ['latte'], kopi: ['latte'], tea: ['teh'],
    drink: ['ais', 'iced', 'shake', 'latte'], drinks: ['ais', 'iced', 'shake', 'latte'], minum: ['ais', 'iced', 'shake', 'latte'],
    print: ['printing', 'binding', 'lamination'], assignment: ['printing', 'binding'], report: ['printing', 'binding'],
    book: ['textbook', 'papers'], books: ['textbook', 'papers'], buku: ['textbook', 'papers'],
    exam: ['papers', 'calculator', 'textbook'], study: ['textbook', 'papers', 'calculator', 'printing'],
    gift: ['keychain', 'scrunchie', 'tote', 'strap'], hadiah: ['keychain', 'scrunchie', 'tote', 'strap']
  };
  var AI_STOP = ['i', 'a', 'an', 'the', 'want', 'need', 'something', 'some', 'for', 'and', 'to', 'with', 'me', 'my', 'please',
    'saya', 'nak', 'mahu', 'yang', 'dan', 'untuk'];

  function recommend(budget, category, wish) {
    var terms = [];
    wish.toLowerCase().split(/[^a-z0-9&]+/).forEach(function (w) {
      if (w.length < 2 || AI_STOP.indexOf(w) !== -1) return;
      [w].concat(AI_WORDS[w] || []).forEach(function (t) { if (terms.indexOf(t) === -1) terms.push(t); });
    });

    // Only products the student can actually buy: in stock, within budget, right category, not their own
    var scored = DB.products.filter(function (p) {
      return p.stock > 0 && p.price <= budget && p.shopId !== me.shopId && (category === 'Any' || p.category === category);
    }).map(function (p) {
      var name = p.name.toLowerCase();
      var text = (p.description + ' ' + shopById(p.shopId).name).toLowerCase();
      var hits = terms.filter(function (t) { return name.indexOf(t) !== -1 || text.indexOf(t) !== -1; });
      var score = sum(hits.map(function (t) { return name.indexOf(t) !== -1 ? 3 : 1; })) + p.sold / 100;
      return { product: p, hits: hits, score: score };
    });

    var matched = scored.filter(function (x) { return x.hits.length; });
    // Best matches first, then fill up to 5 with popular picks that also fit the budget
    scored.sort(function (a, b) { return b.score - a.score; });
    var list = scored.slice(0, 5);

    // A small combo from the top picks that still fits the budget
    var combo = [];
    var total = 0;
    list.forEach(function (x) {
      if (combo.length < 3 && total + x.product.price <= budget) { combo.push(x.product); total += x.product.price; }
    });

    return { list: list, combo: combo, total: total, noMatch: terms.length > 0 && !matched.length };
  }

  function aiResultsHtml(r, budget) {
    if (!r.list.length) return emptyState('search', 'Nothing fits that budget', 'Try a higher budget or another category.');
    var html = r.noMatch ? '<p class="notice">No exact match for what you typed, so here are popular picks within your budget.</p>' : '';
    html += '<h4 class="ai-title">Recommended for you</h4>' + r.list.map(function (x) {
      var p = x.product;
      var shop = shopById(p.shopId);
      var why = (x.hits.length ? 'Matches "' + esc(x.hits.slice(0, 2).join(', ')) + '"' : 'Popular choice') + ' · ' + p.sold + ' sold';
      return '<a class="ai-item" href="#product/' + p.id + '" data-action="close-modal">' +

  /* ======================= 4. Buyer: Product detail ======================= */

    return String(d.getHours()).padStart(2, '0') + ':00';

    var p = productById(id);
    if (!p) return notFound('Product not found');
    var s = shopById(p.shopId);

    var orderBox;
    if (mine) {
      orderBox = '<div class="notice">This is your own product. <a href="#seller/products">Manage it in Seller mode →</a></div>';
    } else if (soldOut) {
      orderBox = '<button class="btn btn-primary btn-block" disabled>Sold Out</button>';
    } else {

        '<form data-form="order" data-id="' + p.id + '" class="order-form">' +
        '<div class="field"><span>Quantity</span>' +
        '<div class="qty"><button type="button" data-action="qty" data-id="' + p.id + '" data-d="-1" aria-label="Less">−</button>' +
        '<output id="qty-val">' + state.qty + '</output>' +
        '<button type="button" data-action="qty" data-id="' + p.id + '" data-d="1" aria-label="More">+</button>' +
        '<span class="muted small">max ' + p.stock + '</span></div></div>' +
        '<label class="field"><span>Pickup point</span><select name="pickupPoint">' +
        DB.pickupPoints.map(function (pt) {

        }).join('') + '</select></label>' +
        '<label class="field"><span>Pickup time (today)</span><input type="time" name="pickupTime" value="' + defaultPickupTime() + '" required></label>' +
        '<label class="field"><span>Note to seller (optional)</span><textarea name="note" rows="2" maxlength="150" placeholder="e.g. Extra sambal, kurang manis…"></textarea></label>' +

  /* ======================= 5. Buyer: My Orders ======================= */

  function tracker(status) {
    if (status === 'Cancelled') return '<div class="tracker-cancelled">This order was cancelled</div>';
    var current = STEPS.indexOf(status);
    return '<ol class="tracker">' + STEPS.map(function (step, i) {
      return '<li class="' + (i <= current ? 'done' : '') + (i === current ? ' current' : '') + '"><span class="dot">' +
        (i <= current ? svg('check') : i + 1) + '</span><span class="step-label">' + step + '</span></li>';
    }).join('') + '</ol>';
  }

  function orderItems(o) {
    return '<ul class="items">' + o.items.map(function (i) {
      return '<li><span>' + i.qty + ' × ' + esc(i.name) + '</span><span>' + rm(i.price * i.qty) + '</span></li>';
    }).join('') + '</ul>' +
      '<div class="total-row"><span>Total</span><strong>' + rm(orderTotal(o)) + '</strong></div>' +
      '<div class="order-meta"><span>' + svg('pin') + ' ' + esc(o.pickupPoint) + '</span><span>' + svg('clock') + ' ' + fmtPickup(o.pickupTime) + '</span></div>' +
      (o.note ? '<div class="order-note">' + svg('note') + ' ' + esc(o.note) + '</div>' : '');
  }

  function viewOrders() {
    var orders = DB.orders.filter(function (o) { return o.buyerId === me.id; }).sort(byNewest);
    var list = orders.length ? orders.map(function (o) {
      var s = shopById(o.shopId);
      return '<article class="card order">' +
        '<header class="order-head"><div><strong>Order #' + o.id + '</strong>' +
        '<span class="muted small">' + timeAgo(o.createdAt) + ' · <a href="#shop/' + s.id + '">' + esc(s.name) + '</a></span></div>' +
        badge(o.status) + '</header>' +
        tracker(o.status) + orderItems(o) +
        (o.status === 'Pending'
          ? '<div class="order-actions"><button class="btn btn-danger-outline" data-action="ask-cancel-order" data-id="' + o.id + '">Cancel order</button></div>'
          : '') +

    return '<h1 class="page-title">My Orders</h1><p class="muted page-sub">You can cancel an order only while it is Pending.</p>' +

  /* ======================= 6. Chat ======================= */

  function chatListHtml(activeId) {
    return DB.conversations.slice().sort(function (a, b) {
      var la = a.messages.length ? a.messages[a.messages.length - 1].time : 0;
      var lb = b.messages.length ? b.messages[b.messages.length - 1].time : 0;
      return lb - la;
    }).map(function (c) {
      var last = c.messages[c.messages.length - 1];
      return '<a class="chat-item' + (c.id === activeId ? ' active' : '') + '" href="#chat/' + c.id + '">' +
        '<img class="avatar-img" src="' + esc(c.avatar) + '" alt="">' +
        '<div class="chat-item-body"><div class="chat-item-top"><strong>' + esc(c.name) + '</strong>' +
        '<span class="muted small">' + (last ? timeAgo(last.time) : '') + '</span></div>' +
        '<div class="chat-item-bottom"><span class="muted small preview">' +
        (last ? (last.from === 'me' ? 'You: ' : '') + esc(last.text) : 'No messages yet') + '</span>' +
        (c.unread ? '<span class="nav-badge static">' + c.unread + '</span>' : '') + '</div></div></a>';
    }).join('');
  }

  function messagesHtml(c) {
    var html = c.messages.length ? c.messages.map(function (m) {
      return '<div class="msg ' + (m.from === 'me' ? 'me' : 'them') + '"><div class="bubble">' + esc(m.text) +
        '<span class="msg-time">' + clock(m.time) + '</span></div></div>';
    }).join('') : '<p class="muted center">No messages yet. Say hi!</p>';
    if (state.typing[c.id]) html += '<div class="msg them"><div class="bubble typing"><i></i><i></i><i></i></div></div>';
    return html;
  }

  function viewSellerOrders() {

  /* ======================= 11. Seller: Sales Dashboard ======================= */

  function viewDashboard() {
    // Every number below is calculated from the orders array.
    var orders = DB.orders.filter(function (o) { return o.shopId === me.shopId; });
    var completed = orders.filter(function (o) { return o.status === 'Completed'; });
    var pending = orders.filter(function (o) { return o.status === 'Pending'; });
    var totalSales = sum(completed.map(orderTotal));

    // Sales for the last 7 days (completed orders, grouped by order date)
    var days = [];
    for (var i = 6; i >= 0; i--) {
      var d = new Date();
      d.setHours(0, 0, 0, 0);
      d.setDate(d.getDate() - i);
      days.push(d);
    }
    var labels = days.map(function (d) { return d.toLocaleDateString('en-MY', { weekday: 'short', day: 'numeric' }); });
    var daily = days.map(function (d) {
      return sum(completed.filter(function (o) { return sameDay(o.createdAt, d); }).map(orderTotal));
    });

    // Best-selling products (top 3 by quantity, cancelled orders excluded)
    var sold = {};
    orders.filter(function (o) { return o.status !== 'Cancelled'; }).forEach(function (o) {
      o.items.forEach(function (it) {
        if (!sold[it.productId]) sold[it.productId] = { name: it.name, qty: 0, revenue: 0 };
        sold[it.productId].qty += it.qty;
        sold[it.productId].revenue += it.qty * it.price;
      });
    });
    var best = Object.keys(sold).map(function (k) { return sold[k]; })
      .sort(function (a, b) { return b.qty - a.qty; }).slice(0, 3);

    afterRender = function () { drawChart(labels, daily); };

    function stat(icon, label, value, cls) {
      return '<div class="card stat ' + (cls || '') + '"><span class="stat-icon">' + svg(icon) + '</span>' +
        '<span class="stat-label">' + label + '</span><strong>' + value + '</strong></div>';
    }

    return '<div class="page-head"><div><h1 class="page-title">Sales Dashboard</h1><p class="muted page-sub">' + esc(myShop().name) + ' · last 7 days</p></div>' +
      '<a class="btn btn-outline" href="#seller/orders">View orders</a></div>' +
      '<div class="stats">' +
      stat('wallet', 'Total Sales', rm(totalSales), 'stat-main') +
      stat('receipt', 'Total Orders', orders.length) +
      stat('clock', 'Pending Orders', pending.length) +
      stat('check', 'Completed Orders', completed.length) +
      '</div>' +
      '<section class="card panel"><h2>Sales – last 7 days</h2><p class="muted small">Completed orders, in RM</p>' +
      '<div class="chart-box"><canvas id="salesChart" aria-label="Bar chart of sales for the last 7 days"></canvas></div></section>' +
      '<div class="dash-grid">' +
      '<section class="card panel"><h2>Best-Selling Products</h2>' +
      (best.length ? '<ol class="best">' + best.map(function (b, i) {
        return '<li><span class="rank">' + (i + 1) + '</span><div><strong>' + esc(b.name) + '</strong>' +
          '<span class="muted small">' + rm(b.revenue) + ' revenue</span></div><b>' + b.qty + ' sold</b></li>';
      }).join('') + '</ol>' : '<p class="muted">No sales yet.</p>') + '</section>' +
      '<section class="card panel"><h2>Order Status Summary</h2><ul class="status-summary">' +
      STATUSES.map(function (s) {
        var n = orders.filter(function (o) { return o.status === s; }).length;
        var pct = orders.length ? Math.round(n / orders.length * 100) : 0;
        return '<li>' + badge(s) + '<div class="bar"><i class="bg-' + s + '" style="width:' + pct + '%"></i></div><b>' + n + '</b></li>';
      }).join('') + '</ul></section>' +
      '</div>';
  }

  function drawChart(labels, data) {
    var canvas = $('#salesChart');
    if (!canvas) return;
    if (chart) { chart.destroy(); chart = null; }

    // Fallback when Chart.js could not be loaded (e.g. no internet)
    if (typeof window.Chart === 'undefined') {
      var max = Math.max.apply(null, data.concat([1]));
      canvas.parentElement.innerHTML = '<div class="bars">' + data.map(function (v, i) {
        return '<div class="bar-col"><span class="small">' + (v ? v.toFixed(0) : '') + '</span>' +
          '<i style="height:' + Math.round(v / max * 100) + '%"></i><span class="muted small">' + labels[i] + '</span></div>';
      }).join('') + '</div>';
      return;
    }

    chart = new window.Chart(canvas, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{ label: 'Sales (RM)', data: data, backgroundColor: '#C8102E', hoverBackgroundColor: '#9E0B22', borderRadius: 6, maxBarThickness: 38 }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: function (c) { return ' ' + rm(c.parsed.y); } } }
        },
        scales: {
          y: { beginAtZero: true, grid: { color: '#EEF1F5' }, ticks: { callback: function (v) { return 'RM' + v; } } },
          x: { grid: { display: false } }
        }
      }
    });
  }

  /* ======================= Click actions ======================= */

  var actions = {
    'modal-bg': function (el, e) { if (e.target === el) closeModal(); },
    'close-modal': closeModal,

    'mode': function (el) {
      state.mode = el.dataset.mode;
      go(state.mode === 'seller' ? 'seller/dashboard' : 'home');
    },

    'continue-demo': function () {
      setLogin(true);
      go('home');
      toast('Welcome to SMart, ' + me.name.split(' ')[0] + '!', 'success');
    },

    'logout': function () {
      setLogin(false);
      state.mode = 'buyer';
      go('login');
      toast('You have logged out');
    },

    'category': function (el) {
      state.category = el.dataset.cat;
      $('#chips').innerHTML = chipsHtml();
      updateHome();
    },

    'like': function (el) {
      var p = DB.posts.find(function (x) { return x.id === Number(el.dataset.id); });
      if (!p) return;
      p.liked = !p.liked;
      p.likes = (p.likes || 0) + (p.liked ? 1 : -1);
      refreshPost(p.id);
    },

    'toggle-comments': function (el) {
      var id = Number(el.dataset.id);
      state.openComments[id] = !state.openComments[id];
      refreshPost(id);
      var input = $('#post-' + id + ' .comment-form input');
      if (input) input.focus();
    },

    'ai-open': openAiModal,

    'shop-tab': function (el) {
      state.shopTab = el.dataset.tab;
      render();
    },

    'chat-seller': function (el) {
      var s = shopById(Number(el.dataset.id));
      var c = DB.conversations.find(function (x) { return x.shopId === s.id; });
      if (!c) {
        c = { id: nextId(DB.conversations), name: s.name, role: 'Seller', shopId: s.id, avatar: s.logo, unread: 0, messages: [] };
        DB.conversations.push(c);
      }
      go('chat/' + c.id);
    },

    'qty': function (el) {
      var p = productById(Number(el.dataset.id));
      state.qty = Math.max(1, Math.min(p.stock, state.qty + Number(el.dataset.d)));
      $('#qty-val').textContent = state.qty;
      $('#qty-total').textContent = rm(p.price * state.qty);
      if (state.qty === p.stock && Number(el.dataset.d) > 0) toast('Only ' + p.stock + ' left in stock');
    },

    'confirm-order': function () {
      var po = state.pendingOrder;
      var p = po && productById(po.productId);
      closeModal();
      if (!p || p.stock < po.qty) { toast('Sorry, not enough stock', 'error'); render(); return; }
      p.stock -= po.qty;
      p.sold += po.qty;
      DB.orders.push({
        id: nextId(DB.orders), buyerId: me.id, buyerName: me.name, shopId: p.shopId,
        items: [{ productId: p.id, name: p.name, price: p.price, qty: po.qty }],
        pickupPoint: po.pickupPoint, pickupTime: po.pickupTime, note: po.note,
        status: 'Pending', paid: false, createdAt: Date.now()
      });
      state.pendingOrder = null;
      state.qty = 1;
      go('orders');
      toast('Order placed', 'success');
    },

    'ask-cancel-order': function (el) {
      confirmModal('Cancel this order?', 'Order #' + el.dataset.id + ' will be cancelled and the seller will be notified.', 'Yes, cancel order', 'cancel-order', el.dataset.id, true);
    },

    'cancel-order': function (el) {
      var o = orderById(Number(el.dataset.id));
      closeModal();
      if (!o || o.status !== 'Pending') { toast('This order can no longer be cancelled', 'error'); render(); return; }
      o.status = 'Cancelled';
      restock(o);
      render();
      toast('Order cancelled');
    },

    'order-filter': function (el) {
      state.orderFilter = el.dataset.status;
      render();
    },

    'order-status': function (el) {
      var o = orderById(Number(el.dataset.id));
      var status = el.dataset.status;
      if (!o) return;
      if (status === 'Completed') {
        var paid = $('#paid-' + o.id);
        if (!paid || !paid.checked) { toast('Tick "Payment received" first', 'error'); return; }
        o.paid = true;
      }
      if (status === 'Cancelled') restock(o);
      o.status = status;
      render();
      toast({
        Accepted: 'Order #' + o.id + ' accepted',
        Cancelled: 'Order #' + o.id + ' rejected',
        Ready: 'Order #' + o.id + ' is ready for pickup',
        Completed: 'Order #' + o.id + ' completed'
      }[status], status === 'Cancelled' ? '' : 'success');
    },

    'add-product': function () { productForm(null); },
    'edit-product': function (el) { productForm(productById(Number(el.dataset.id))); },

    'ask-delete-product': function (el) {
      var p = productById(Number(el.dataset.id));
      confirmModal('Delete product?', '"' + esc(p.name) + '" will be removed from your shop.', 'Delete', 'delete-product', p.id, true);
    },

    'delete-product': function (el) {
      var id = Number(el.dataset.id);
      DB.products = DB.products.filter(function (p) { return p.id !== id; });
      closeModal();
      render();
      toast('Product deleted');
    },

    'ask-delete-post': function (el) {
      confirmModal('Delete post?', 'This post will be removed from the buyer feed.', 'Delete', 'delete-post', el.dataset.id, true);
    },

    'delete-post': function (el) {
      var id = Number(el.dataset.id);
      DB.posts = DB.posts.filter(function (p) { return p.id !== id; });
      closeModal();
      render();
      toast('Post deleted');
    }
  };

  /* ======================= Form submits ======================= */

  function values(form) {
    var out = {};
    new FormData(form).forEach(function (v, k) { out[k] = typeof v === 'string' ? v.trim() : v; });
    return out;
  }

  var forms = {
    ai: function (form) {
      var v = values(form);
      var budget = parseFloat(v.budget);
      if (!(budget > 0)) { toast('Please enter your budget', 'error'); return; }
      state.ai = { budget: v.budget, category: v.category, wish: v.wish };
      var box = $('#ai-results');
      box.innerHTML = '<p class="muted center ai-thinking">Finding the best picks…</p>';
      // short pause so it feels like the system is thinking
      setTimeout(function () {
        if ($('#ai-results')) $('#ai-results').innerHTML = aiResultsHtml(recommend(budget, v.category, v.wish), budget);
      }, 500);
    },

    login: function () {
      setLogin(true);
      go('home');
      toast('Welcome back, ' + me.name.split(' ')[0] + '!', 'success');
    },

    register: function () { go('pending'); },

    order: function (form) {
      var p = productById(Number(form.dataset.id));
      var v = values(form);
      if (!p || p.stock < 1) { toast('This product is sold out', 'error'); return; }
      state.qty = Math.max(1, Math.min(state.qty, p.stock));
      state.pendingOrder = { productId: p.id, qty: state.qty, pickupPoint: v.pickupPoint, pickupTime: v.pickupTime, note: v.note };
      openModal(
        '<h3>Confirm your order</h3>' +
        '<ul class="items"><li><span>' + state.qty + ' × ' + esc(p.name) + '</span><span>' + rm(p.price * state.qty) + '</span></li></ul>' +
        '<div class="total-row"><span>Total</span><strong>' + rm(p.price * state.qty) + '</strong></div>' +
        '<div class="order-meta"><span>' + svg('store') + ' ' + esc(shopById(p.shopId).name) + '</span><span>' + svg('pin') + ' ' + esc(v.pickupPoint) + '</span><span>' + svg('clock') + ' ' + fmtPickup(v.pickupTime) + '</span></div>' +
        (v.note ? '<div class="order-note">' + svg('note') + ' ' + esc(v.note) + '</div>' : '') +
        '<p class="hint">Pay the seller at pickup (cash or DuitNow QR).</p>' +
        '<div class="modal-actions"><button class="btn btn-ghost" data-action="close-modal">Back</button>' +
        '<button class="btn btn-primary" data-action="confirm-order">Confirm Order</button></div>'
      );
    },

    chat: function (form) {
      var id = Number(form.dataset.id);
      var c = convById(id);
      var input = form.elements.text;
      var text = input.value.trim();
      if (!c || !text) return;
      c.messages.push({ from: 'me', text: text, time: Date.now() });
      input.value = '';
      input.focus();
      state.typing[id] = true;
      refreshChat(id);

      // Fake reply from the other person after 1.5 seconds
      setTimeout(function () {
        state.typing[id] = false;
        c.messages.push({ from: 'them', text: DB.autoReplies[replyIndex++ % DB.autoReplies.length], time: Date.now() });
        if (!refreshChat(id)) {
          c.unread = (c.unread || 0) + 1;
          toast('New message from ' + c.name);
          if (state.loggedIn) {
            renderShell();
            var list = $('#chat-list-items');
            if (list) list.innerHTML = chatListHtml(Number(route()[1]) || 0);
          }
        }
      }, 1500);
    },

    shop: function (form) {
      var v = values(form);
      var s = myShop();
      s.name = v.name;
      s.description = v.description;
      s.pickup = v.pickup;
      s.color = v.color || s.color;
      s.logoUrl = v.logoUrl;
      s.logo = v.logoUrl || DB.makeImg(DB.initials(s.name), s.color, 200, 200);
      render();
      toast('Shop updated', 'success');
    },

    product: function (form) {
      var v = values(form);
      var price = Math.round(parseFloat(v.price) * 100) / 100;
      var stock = parseInt(v.stock, 10);
      if (!(price > 0) || !(stock >= 0)) { toast('Please enter a valid price and stock', 'error'); return; }
      var cat = DB.categories.find(function (c) { return c.name === v.category; });
      var placeholder = DB.makeImg(DB.initials(v.name), cat.color);
      var id = Number(form.dataset.id);

      if (id) {
        var p = productById(id);
        p.name = v.name;
        p.price = price;
        p.stock = stock;
        p.description = v.description;
        p.image = v.image || placeholder;
        p.category = v.category;
      } else {
        DB.products.push({
          id: nextId(DB.products), shopId: me.shopId, name: v.name, category: v.category,
          price: price, stock: stock, sold: 0, image: v.image || placeholder, description: v.description
        });
      }
      closeModal();
      render();
      toast(id ? 'Product updated' : 'Product added', 'success');
    },

    post: function (form) {
      var v = values(form);
      if (!v.text) return;
      DB.posts.push({
        id: nextId(DB.posts), shopId: me.shopId, createdAt: Date.now(), text: v.text, image: v.image,
        likes: 0, liked: false, comments: []
      });
      render();
      toast('Post published', 'success');
    },

    comment: function (form) {
      var id = Number(form.dataset.id);
      var p = DB.posts.find(function (x) { return x.id === id; });
      var text = form.elements.text.value.trim();
      if (!p || !text) return;
      if (!p.comments) p.comments = [];
      p.comments.push({ name: me.name, text: text, time: Date.now() });
      state.openComments[id] = true;
      refreshPost(id);
      var input = $('#post-' + id + ' .comment-form input');
      if (input) input.focus();
    }
  };

  /* ======================= Global event listeners ======================= */

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var fn = actions[el.dataset.action];
    if (fn) fn(el, e);
  });

  document.addEventListener('submit', function (e) {
    var form = e.target.closest('form[data-form]');
    if (!form) return;
    e.preventDefault();
    forms[form.dataset.form](form);
  });

  document.addEventListener('input', function (e) {
    if (e.target.id !== 'search') return;
    state.search = e.target.value;
    updateHome();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeModal();
  });

  // Broken image URL (e.g. typed by the seller) -> show a placeholder instead
  document.addEventListener('error', function (e) {
    var img = e.target;
    if (img && img.tagName === 'IMG' && !img.dataset.fallback) {
      img.dataset.fallback = '1';
      img.src = FALLBACK_IMG;
    }
  }, true);

  window.addEventListener('hashchange', render);
  render();
})();
  </script>
</body>
</html>
